<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d00000"/>
      <stop offset="100%" stop-color="#faa307"/>
    </linearGradient>
  </defs>
  
  <!-- Dark base background -->
  <circle cx="50" cy="50" r="48" fill="#03071e"/>
  
  <!-- Gradient ring -->
  <circle cx="50" cy="50" r="40" fill="url(#ringGrad)"/>
  
  <!-- Inner dark circle -->
  <circle cx="50" cy="50" r="32" fill="#03071e"/>
  
  <!-- The F Letter -->
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffba08" text-anchor="middle" dominant-baseline="central">F</text>
</svg>